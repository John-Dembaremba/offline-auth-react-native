repos:
  - repo: local
    hooks:
      - id: format-check
        name: Check TypeScript formatting
        entry: make format-check
        language: system
        pass_filenames: false
        always_run: true

      - id: lint
        name: Lint TypeScript source
        entry: make lint
        language: system
        pass_filenames: false
        always_run: true

      - id: typecheck
        name: TypeScript type checking
        entry: make typecheck
        language: system
        pass_filenames: false
        always_run: true

      - id: unit-tests
        name: Run unit tests
        entry: make unit-test
        language: system
        pass_filenames: false
        always_run: true

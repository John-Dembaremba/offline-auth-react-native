name: Static Analysis & Code Quality

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    static-analysis:
        name: Format, Lint & TypeScript
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.4"

            - name: Install dependencies
              run: bun install --frozen-lockfile --ignore-scripts

            - name: Run static analysis and code quality checks
              run: make check

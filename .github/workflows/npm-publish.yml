
name: npm Staged Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Stage npm Package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare npm CLI
        run: npm install --global npm@latest

      - name: Verify npm CLI version
        run: npm --version

      - name: Verify release version
        run: |
          node - <<'NODE'
          const pkg = require('./package.json');
          const tag = `v${pkg.version}`;

          if (
            process.env.GITHUB_EVENT_NAME === 'push' &&
            process.env.GITHUB_REF_NAME !== tag
          ) {
            throw new Error(
              `Release tag ${process.env.GITHUB_REF_NAME} does not match ${tag}`
            );
          }

          console.log(`Validated ${pkg.name}@${pkg.version}`);
          NODE

          VERSION=$(node -p "require('./package.json').version")

          git rev-parse --verify "refs/tags/v${VERSION}"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            git merge-base --is-ancestor \
              "v${VERSION}^{commit}" HEAD
          fi

      - name: Run static checks
        run: make check

      - name: Run Jest tests
        run: make unit-test

      - name: Build package
        run: bun run prepare

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Stage npm release using OIDC
        run: npm stage publish --access public
